version = 1

# ---------------------------------------------------------------------------
# Project documentation and other plain-text/configuration files that cannot
# (or should not) carry a comment header of their own.
# ---------------------------------------------------------------------------

[[annotations]]
path = [
    ".gitignore",
    ".gitlab/issue_templates/*.md",
    "AUTHORS",
    "COPYING",
    "INSTALL",
    "MAINTAINERS",
    "NEWS",
    "README.md",
    "THANKS",
    "help/LINGUAS",
    "meson_options.txt",
    "po/LINGUAS",
    "po/POTFILES.in",
    "po/POTFILES.skip",
    "shotwell.doap",
]
SPDX-FileCopyrightText = "2016 Software Freedom Conservancy Inc."
SPDX-License-Identifier = "CC0-1.0"

# ---------------------------------------------------------------------------
# Translations. The gettext tooling rewrites the leading comment block of
# .po files, so they are annotated here instead of being tagged inline.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Note: po/ is deliberately left untouched (gettext rewrites the leading
# comment block of .po files), everything in it is annotated here instead.
# ---------------------------------------------------------------------------

[[annotations]]
path = ["po/*.po", "help/*/*.po", "po/meson.build"]
SPDX-FileCopyrightText = "2016 Translation authors"
SPDX-License-Identifier = "LGPL-2.1-or-later"

